<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>单词图片学习</title>
  <link rel="stylesheet" href="css/app.css" />
</head>
<body>
<div class="app">

  <!-- 首页 -->
  <section id="view-home" class="panel">
    <div class="home-hero">
      <div class="hero-emoji">✨📖🎉</div>
      <h1>单词图片学习</h1>
      <p class="lead">和爸爸妈妈一起：看图、选词、拼一拼，每天玩一小会儿就超棒。</p>
    </div>
    <p id="home-empty" class="empty hidden">词表为空：请先在 <code>VOCAB</code> 中添加条目。</p>
    <div class="modes">
      <button type="button" id="go-review-focus" class="mode-card mode-card--span">
        <span class="mode-icon">⭐📚</span>
        <span class="mode-title">重点复习词汇</span>
        <span class="mode-desc">按日期查看需要巩固的单词</span>
      </button>
      <button type="button" id="go-flash" class="mode-card">
        <span class="mode-icon">🃏✨</span>
        <span class="mode-title">卡片模式</span>
        <span class="mode-desc">翻翻小卡片，看图记单词</span>
      </button>
      <button type="button" id="go-quiz-word" class="mode-card">
        <span class="mode-icon">🔍🖼️</span>
        <span class="mode-title">看图选词</span>
        <span class="mode-desc">每轮 20 题，先练没测过的词</span>
      </button>
      <button type="button" id="go-quiz-image" class="mode-card">
        <span class="mode-icon">🔤🎨</span>
        <span class="mode-title">看词选图</span>
        <span class="mode-desc">单词出现，点对的图片</span>
      </button>
      <button type="button" id="go-spell" class="mode-card">
        <span class="mode-icon">✍️⭐</span>
        <span class="mode-title">拼写模式</span>
        <span class="mode-desc">每轮 20 词，动手拼出来</span>
      </button>
      <button type="button" id="go-category-spell" class="mode-card">
        <span class="mode-icon">🏷️✍️</span>
        <span class="mode-title">分类拼写</span>
        <span class="mode-desc">按颜色、形状等主题练习拼写</span>
      </button>
      <button type="button" id="go-first" class="mode-card">
        <span class="mode-icon">🔤🚀</span>
        <span class="mode-title">首字母模式</span>
        <span class="mode-desc">每轮 20 词，第一个字母你会吗</span>
      </button>
    </div>
    <div class="home-settings">
      <label class="inline">
        <input type="checkbox" id="setting-auto-next" />
        答对自动下一题
      </label>
      <label class="inline">
        <input type="checkbox" id="setting-sound-on" />
        胜利短音效（很轻）
      </label>
      <button type="button" class="secondary" id="reset-seen-words">清空已测记录</button>
    </div>
    <div class="home-secondary-menus">
      <button type="button" id="go-wordbook" class="secondary">生词本</button>
    </div>
  </section>

  <!-- 重点复习：选日期 -->
  <section id="view-review-picker" class="panel hidden">
    <div class="toolbar">
      <button type="button" class="secondary" id="review-picker-back">← 返回</button>
      <span class="spacer"></span>
    </div>
    <h2 style="margin:0 0 0.35rem;font-size:1.35rem;">重点复习词汇</h2>
    <p class="lead" style="margin-bottom:0.75rem;">选择一个日期，查看该日重点复习词表。</p>
    <div class="category-picker-grid" id="review-picker-grid"></div>
  </section>

  <!-- 重点复习：词表 -->
  <section id="view-review-list" class="panel hidden">
    <div class="toolbar">
      <button type="button" class="secondary" id="review-list-back">← 返回选日期</button>
      <span class="spacer"></span>
    </div>
    <h2 class="wordbook-panel-title" id="review-list-title">重点复习</h2>
    <div class="btn-row review-list-actions">
      <button type="button" id="review-start-spell">开始测试</button>
    </div>
    <div id="review-focus-list" class="wordbook-list"></div>
  </section>

  <!-- 分类拼写：选分类 -->
  <section id="view-category-picker" class="panel hidden">
    <div class="toolbar">
      <button type="button" class="secondary" id="category-picker-back">← 返回</button>
      <span class="spacer"></span>
    </div>
    <h2 style="margin:0 0 0.35rem;font-size:1.35rem;">分类拼写</h2>
    <p class="lead" style="margin-bottom:0.75rem;">选一个主题，每轮最多 20 题，且<strong>只会出现该主题下的词</strong>；本类词不足 20 个时题数会相应变少。题面会显示图片（或表情）和中文释义。</p>
    <div class="category-picker-grid" id="category-picker-grid"></div>
  </section>

  <!-- 分类拼写测验 -->
  <section id="view-category-spell" class="panel hidden">
    <div class="toolbar">
      <button type="button" class="secondary" id="category-spell-back">← 返回选分类</button>
      <span class="spacer"></span>
      <span class="stats" id="category-spell-stats"></span>
    </div>
    <p class="streak-line" id="category-spell-streak" aria-live="polite"></p>
    <div class="round-dots" id="category-spell-dots" aria-hidden="true"></div>
    <div class="figure figure-category-spell">
      <img id="category-spell-img" class="fade-img" alt="" />
      <div id="category-spell-emoji" class="category-spell-emoji hidden" aria-hidden="true"></div>
    </div>
    <p id="category-spell-zh" class="category-spell-zh"></p>
    <input type="text" id="category-spell-input" autocomplete="off" spellcheck="false" placeholder="输入完整英文单词后按 Enter" />
    <p id="category-spell-msg" class="msg hidden" role="status"></p>
    <p id="category-spell-answer-line" class="answer-line hidden"></p>
    <div class="btn-row">
      <button type="button" id="category-spell-submit">提交</button>
      <button type="button" id="category-spell-continue" class="hidden">下一题</button>
      <button type="button" class="secondary" id="category-spell-skip">跳过</button>
      <button type="button" class="secondary" id="category-spell-show-answer">查看答案</button>
      <button type="button" class="secondary" id="category-spell-add-wordbook">加入生词本</button>
    </div>
  </section>

  <!-- 卡片模式 -->
  <section id="view-flash" class="panel hidden">
    <div class="toolbar">
      <button type="button" class="secondary back-btn" data-back>← 返回</button>
      <span class="spacer"></span>
      <button type="button" class="secondary" id="flash-shuffle">打乱顺序</button>
    </div>
    <div class="flash-alphabet" id="flash-alphabet" aria-label="按首字母筛选"></div>
    <p class="stats" id="flash-stats"></p>
    <div class="progress-bar"><div class="progress-fill" id="flash-progress"></div></div>
    <div class="figure figure--flash" id="flash-figure"><img id="flash-img" class="fade-img" alt="" /></div>
    <div class="word-line concealed" id="flash-word" title="点击显示/隐藏单词" data-word="" aria-hidden="true"></div>
    <div class="flash-zh concealed" id="flash-zh" title="点击显示/隐藏"></div>
    <p class="hint">点击图片或英文/中文区域可翻面；隐藏时单词与中文均不可见；按空格键也可显示／隐藏。点字母筛选，再点同一字母取消。</p>
    <div class="btn-row">
      <button type="button" class="secondary" id="flash-prev">上一张</button>
      <button type="button" class="secondary" id="flash-next">下一张</button>
    </div>
  </section>

  <!-- 看图选词 -->
  <section id="view-quiz-word" class="panel hidden">
    <div class="toolbar">
      <button type="button" class="secondary back-btn" data-back>← 返回</button>
      <span class="spacer"></span>
      <span class="stats" id="quiz-word-stats"></span>
    </div>
    <p class="streak-line" id="quiz-word-streak" aria-live="polite"></p>
    <div class="round-dots" id="quiz-word-dots" aria-hidden="true"></div>
    <div class="figure figure--quiz-word" id="quiz-word-figure"><img id="quiz-word-img" class="fade-img" alt="" /></div>
    <div class="options options--quiz-words" id="quiz-word-options"></div>
    <p id="quiz-word-msg" class="msg hidden" role="status"></p>
    <div class="btn-row">
      <button type="button" id="quiz-word-next" class="hidden">下一题</button>
    </div>
  </section>

  <!-- 看词选图 -->
  <section id="view-quiz-image" class="panel hidden">
    <div class="toolbar">
      <button type="button" class="secondary back-btn" data-back>← 返回</button>
      <span class="spacer"></span>
      <span class="stats" id="quiz-image-stats"></span>
    </div>
    <p class="streak-line" id="quiz-image-streak" aria-live="polite"></p>
    <div class="round-dots" id="quiz-image-dots" aria-hidden="true"></div>
    <p class="round-prompt-word" id="quiz-image-prompt"></p>
    <div class="options-grid-images" id="quiz-image-options"></div>
    <p id="quiz-image-msg" class="msg hidden" role="status"></p>
    <div class="btn-row">
      <button type="button" id="quiz-image-next" class="hidden">下一题</button>
    </div>
  </section>

  <!-- 拼写模式 -->
  <section id="view-spell" class="panel hidden">
    <div class="toolbar">
      <button type="button" class="secondary" id="spell-back">← 返回</button>
      <span class="spacer"></span>
      <span class="stats" id="spell-stats"></span>
    </div>
    <p class="streak-line" id="spell-streak" aria-live="polite"></p>
    <div class="round-dots" id="spell-dots" aria-hidden="true"></div>
    <div class="figure figure-spell">
      <img id="spell-img" class="fade-img" alt="" />
      <div id="spell-emoji" class="category-spell-emoji hidden" aria-hidden="true"></div>
    </div>
    <p id="spell-zh" class="category-spell-zh hidden"></p>
    <label class="inline" style="margin-top:0.75rem">
      <input type="checkbox" id="spell-hint-toggle" checked />
      显示首字母提示
    </label>
    <p id="spell-hint" class="hint hidden"></p>
    <input type="text" id="spell-input" autocomplete="off" spellcheck="false" placeholder="输入完整单词后按 Enter" />
    <p id="spell-msg" class="msg hidden" role="status"></p>
    <p id="spell-answer-line" class="answer-line hidden"></p>
    <div class="btn-row">
      <button type="button" id="spell-submit">提交</button>
      <button type="button" id="spell-continue" class="hidden">下一题</button>
      <button type="button" class="secondary" id="spell-skip">跳过</button>
      <button type="button" class="secondary" id="spell-show-answer">查看答案</button>
      <button type="button" class="secondary" id="spell-add-wordbook">加入生词本</button>
    </div>
  </section>

  <!-- 首字母模式 -->
  <section id="view-first" class="panel hidden">
    <div class="toolbar">
      <button type="button" class="secondary back-btn" data-back>← 返回</button>
      <span class="spacer"></span>
      <span class="stats" id="first-stats"></span>
    </div>
    <p class="streak-line" id="first-streak" aria-live="polite"></p>
    <div class="round-dots" id="first-dots" aria-hidden="true"></div>
    <div class="figure figure--short"><img id="first-img" class="fade-img" alt="" /></div>
    <input type="text" id="first-input" autocomplete="off" spellcheck="false" maxlength="8"
           placeholder="输入该词的首字母后按 Enter" />
    <p id="first-msg" class="msg hidden" role="status"></p>
    <p id="first-answer-line" class="answer-line hidden"></p>
    <div class="btn-row">
      <button type="button" id="first-submit">提交</button>
      <button type="button" id="first-continue" class="hidden">下一题</button>
      <button type="button" class="secondary" id="first-skip">跳过</button>
      <button type="button" class="secondary" id="first-show-answer">查看答案</button>
      <button type="button" class="secondary" id="first-add-wordbook">加入生词本</button>
    </div>
  </section>

  <!-- 生词本 -->
  <section id="view-wordbook" class="panel hidden">
    <div class="toolbar">
      <button type="button" class="secondary back-btn" data-back>← 返回</button>
      <span class="spacer"></span>
    </div>
    <h2 class="wordbook-panel-title">生词本</h2>
    <p class="hint" style="text-align:left;">已保存到当前浏览器本地存储（localStorage）。</p>
    <div id="wordbook-list" class="wordbook-list"></div>
  </section>

</div><!-- /.app -->

<div id="confetti-root" class="confetti-root" aria-hidden="true"></div>
<div id="praise-toast" class="praise-toast" role="status" aria-live="assertive" aria-atomic="true"></div>

<div id="round-overlay" class="round-overlay hidden" role="dialog" aria-modal="true" aria-labelledby="round-overlay-title">
  <div class="round-overlay-inner">
    <h3 id="round-overlay-title">本轮完成</h3>
    <p id="round-overlay-body"></p>
    <div class="round-overlay-actions">
      <button type="button" id="round-overlay-again">再来一轮</button>
      <button type="button" class="secondary" id="round-overlay-home">返回首页</button>
    </div>
  </div>
</div>


  <script src="js/data/vocab.js"></script>
  <script src="js/config.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/data/categories.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/vocab-core.js"></script>
  <script src="js/fx.js"></script>
  <script src="js/round-ui.js"></script>
  <script src="js/nav.js"></script>
  <script src="js/data/review-focus.js"></script>
  <script src="js/wordbook.js"></script>
  <script src="js/modes/flash.js"></script>
  <script src="js/modes/quiz-word.js"></script>
  <script src="js/modes/quiz-image.js"></script>
  <script src="js/modes/spell.js"></script>
  <script src="js/review-focus.js"></script>
  <script src="js/modes/category-spell.js"></script>
  <script src="js/modes/first.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
