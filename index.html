<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>单词图片学习</title>
  <style>
    @import url("https://fonts.googleapis.com/css2?family=Nunito:wght@500;700;800&display=swap");
    :root {
      --bg: #fff7ed;
      --bg-accent: #eff6ff;
      --card: #ffffff;
      --text: #1f2937;
      --muted: #64748b;
      --accent: #f97316;
      --accent-2: #fb923c;
      --accent-hover: #ea580c;
      --danger: #ef4444;
      --ok: #22c55e;
      --border: #fed7aa;
      --radius: 18px;
      --pill: 9999px;
      --shadow: 0 16px 36px rgba(249, 115, 22, 0.12);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "Nunito", system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background: linear-gradient(135deg, var(--bg) 0%, var(--bg-accent) 100%);
      color: var(--text);
      line-height: 1.5;
      min-height: 100vh;
      border-top: 4px solid var(--accent);
    }
    .app {
      max-width: 640px;
      margin: 0 auto;
      padding: 1rem 1rem 2rem;
    }
    h1 {
      font-size: 1.65rem;
      font-weight: 800;
      margin: 0 0 0.35rem;
    }
    p.lead {
      margin: 0 0 1.25rem;
      color: var(--muted);
      font-size: 1rem;
    }
    .panel {
      background: var(--card);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      border: 1px solid var(--border);
      padding: 1.25rem;
    }
    .hidden { display: none !important; }
    .btn-row {
      display: flex;
      flex-wrap: wrap;
      gap: 0.6rem;
      margin-top: 0.9rem;
    }
    button {
      font: inherit;
      font-weight: 700;
      cursor: pointer;
      border: none;
      border-radius: var(--pill);
      padding: 0.7rem 1.05rem;
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
      color: #fff;
      box-shadow: 0 8px 16px rgba(249, 115, 22, 0.25);
      transition: transform 0.15s ease, filter 0.15s ease, box-shadow 0.15s ease;
    }
    button:hover {
      filter: brightness(1.05);
      box-shadow: 0 10px 20px rgba(249, 115, 22, 0.35);
    }
    button:active { transform: scale(0.96); }
    button.secondary {
      background: #f8fafc;
      color: var(--text);
      border: 1px solid #e2e8f0;
      box-shadow: none;
    }
    button.secondary:hover { background: #eef2ff; }
    button:disabled {
      opacity: 0.55;
      cursor: not-allowed;
      filter: grayscale(0.2);
      box-shadow: none;
    }
    .home-hero {
      text-align: center;
      margin-bottom: 1rem;
    }
    .hero-emoji {
      font-size: 2.1rem;
      margin-bottom: 0.2rem;
    }
    .modes {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 0.7rem;
    }
    .mode-card {
      border-radius: 16px;
      padding: 0.85rem;
      text-align: left;
      min-height: 106px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 0.15rem;
      background: #fff;
      color: var(--text);
      border: 1px solid #fde68a;
      box-shadow: 0 8px 18px rgba(251, 146, 60, 0.18);
    }
    .mode-icon { font-size: 1.3rem; }
    .mode-title { font-size: 1rem; font-weight: 800; }
    .mode-desc { font-size: 0.84rem; color: var(--muted); font-weight: 600; }
    .toolbar {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 0.5rem;
      margin-bottom: 1rem;
    }
    .toolbar .spacer { flex: 1; }
    .back-btn { padding-inline: 0.75rem; }
    .flash-alphabet {
      display: flex;
      flex-wrap: wrap;
      gap: 0.35rem;
      margin-bottom: 0.75rem;
      justify-content: center;
    }
    .flash-alphabet button.flash-letter {
      min-width: 2rem;
      padding: 0.35rem 0.4rem;
      font-size: 0.78rem;
      font-weight: 800;
      border-radius: 8px;
      background: #fff7ed;
      color: var(--text);
      border: 1px solid #fdba74;
      box-shadow: none;
    }
    .flash-alphabet button.flash-letter:hover {
      background: #ffedd5;
      filter: none;
    }
    .flash-alphabet button.flash-letter.active {
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
      color: #fff;
      border-color: transparent;
    }
    .flash-zh {
      margin-top: 0.35rem;
      font-size: 1.05rem;
      font-weight: 700;
      text-align: center;
      color: #9a3412;
      min-height: 1.5rem;
      letter-spacing: 0.02em;
    }
    .flash-zh.concealed {
      visibility: hidden;
      min-height: 1.5rem;
    }
    .progress-bar {
      width: 100%;
      height: 10px;
      background: #ffedd5;
      border-radius: var(--pill);
      overflow: hidden;
      border: 1px solid #fdba74;
      margin-bottom: 0.6rem;
    }
    .progress-fill {
      width: 0%;
      height: 100%;
      background: linear-gradient(90deg, #f97316, #fb923c);
      transition: width 0.25s ease;
    }
    .figure {
      border-radius: var(--radius);
      overflow: hidden;
      background: linear-gradient(145deg, #fff1cc, #dbeafe);
      border: 1px solid var(--border);
      aspect-ratio: 1 / 1;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .figure img {
      max-width: 100%;
      max-height: 100%;
      width: auto;
      height: auto;
      object-fit: contain;
      display: block;
    }
    .fade-img {
      opacity: 1;
      transition: opacity 0.25s ease;
    }
    .fade-img.fading { opacity: 0; }
    .word-line {
      margin-top: 1rem;
      font-size: 2rem;
      font-weight: 800;
      text-align: center;
      min-height: 2.5rem;
      letter-spacing: 0.03em;
      text-shadow: 0 2px 12px rgba(249, 115, 22, 0.25);
    }
    .word-line.concealed {
      color: transparent;
      text-shadow: none;
      user-select: none;
      cursor: pointer;
    }
    .hint {
      font-size: 0.9rem;
      color: var(--muted);
      text-align: center;
      margin-top: 0.35rem;
      font-weight: 600;
    }
    .stats {
      font-size: 0.95rem;
      color: var(--muted);
      margin-top: 0.5rem;
      font-weight: 700;
    }
    .msg {
      margin-top: 0.75rem;
      padding: 0.7rem 0.85rem;
      border-radius: 12px;
      border: 1px solid var(--border);
      font-size: 0.98rem;
      font-weight: 700;
    }
    .msg.ok {
      border-color: #86efac;
      background: #f0fdf4;
      color: #166534;
      animation: pop 0.28s ease;
    }
    .msg.bad {
      border-color: #fecaca;
      background: #fef2f2;
      color: #991b1b;
      animation: shake 0.28s ease;
    }
    label.inline {
      display: flex;
      align-items: center;
      gap: 0.4rem;
      font-size: 0.95rem;
      color: var(--muted);
      user-select: none;
      font-weight: 700;
    }
    input[type="text"] {
      width: 100%;
      font: inherit;
      font-size: 1.02rem;
      padding: 0.75rem 0.85rem;
      border-radius: 14px;
      border: 1px solid #fed7aa;
      margin-top: 0.75rem;
      transition: box-shadow 0.2s ease, border-color 0.2s ease;
    }
    input[type="text"]:focus {
      outline: none;
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(249, 115, 22, 0.22);
    }
    .options {
      display: grid;
      gap: 0.55rem;
      margin-top: 0.75rem;
    }
    .options button.option {
      background: #fff;
      color: var(--text);
      border: 2px solid #fed7aa;
      text-align: left;
      border-radius: 14px;
      box-shadow: none;
      transition: border-color 0.15s ease, background 0.15s ease, transform 0.15s ease;
    }
    .options button.option:hover:not(:disabled) {
      border-color: var(--accent);
      background: #fff7ed;
    }
    .options button.option.correct {
      border-color: #22c55e;
      background: #f0fdf4;
    }
    .options button.option.wrong {
      border-color: #ef4444;
      background: #fef2f2;
    }
    .empty {
      color: var(--muted);
      font-size: 0.95rem;
    }
    .wordbook-entry {
      margin-top: 0.8rem;
    }
    .wordbook-panel-title {
      margin: 0 0 0.35rem;
      font-size: 1.3rem;
      font-weight: 800;
    }
    .wordbook-list {
      margin-top: 0.9rem;
      display: grid;
      gap: 0.5rem;
    }
    .wordbook-item {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      padding: 0.65rem 0.75rem;
      border: 1px solid #fed7aa;
      background: #fff7ed;
      border-radius: 12px;
      font-weight: 700;
    }
    .wordbook-thumb {
      width: 64px;
      height: 64px;
      object-fit: cover;
      border-radius: 10px;
      flex-shrink: 0;
      border: 1px solid #fdba74;
      background: #fff;
    }
    .wordbook-body {
      flex: 1;
      min-width: 0;
    }
    .wordbook-en {
      font-weight: 800;
      overflow-wrap: anywhere;
    }
    .wordbook-zh {
      font-size: 0.88rem;
      font-weight: 700;
      color: var(--muted);
      margin-top: 0.15rem;
      overflow-wrap: anywhere;
    }
    .wordbook-actions {
      flex-shrink: 0;
    }
    .wordbook-empty {
      color: var(--muted);
      background: #fff7ed;
      border: 1px dashed #fdba74;
      border-radius: 12px;
      padding: 0.7rem 0.8rem;
      font-weight: 700;
    }
    .answer-line {
      margin-top: 0.55rem;
      padding: 0.55rem 0.65rem;
      border-radius: 10px;
      border: 1px solid #fdba74;
      background: #fff7ed;
      color: #9a3412;
      font-weight: 800;
      font-size: 0.95rem;
    }
    @keyframes pop {
      0% { transform: scale(0.8); }
      70% { transform: scale(1.05); }
      100% { transform: scale(1); }
    }
    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      25% { transform: translateX(-6px); }
      50% { transform: translateX(6px); }
      75% { transform: translateX(-4px); }
    }
    @media (max-width: 520px) {
      .modes { grid-template-columns: 1fr; }
      .mode-card { min-height: 96px; }
    }
  </style>
</head>
<body>
<div class="app">

  <!-- 首页 -->
  <section id="view-home" class="panel">
    <div class="home-hero">
      <div class="hero-emoji">🌈📚🧠</div>
      <h1>单词图片学习</h1>
      <p class="lead">图片放在与本页同级的 <code>images</code> 文件夹，在脚本里编辑 <code>VOCAB</code> 词表，双击本页即可使用。</p>
    </div>
    <p id="home-empty" class="empty hidden">词表为空：请先在 <code>VOCAB</code> 中添加条目。</p>
    <div class="modes">
      <button type="button" id="go-flash" class="mode-card">
        <span class="mode-icon">🃏</span>
        <span class="mode-title">卡片模式</span>
        <span class="mode-desc">看图记词，点击翻面</span>
      </button>
      <button type="button" id="go-quiz" class="mode-card">
        <span class="mode-icon">🎯</span>
        <span class="mode-title">测验模式</span>
        <span class="mode-desc">看图选词，马上反馈</span>
      </button>
      <button type="button" id="go-spell" class="mode-card">
        <span class="mode-icon">✍️</span>
        <span class="mode-title">拼写模式</span>
        <span class="mode-desc">输入完整英文单词</span>
      </button>
      <button type="button" id="go-first" class="mode-card">
        <span class="mode-icon">🔤</span>
        <span class="mode-title">首字母模式</span>
        <span class="mode-desc">只输入首字母即可</span>
      </button>
    </div>
    <div class="wordbook-entry">
      <button type="button" id="go-wordbook" class="secondary">生词本</button>
    </div>
  </section>

  <!-- 卡片模式 -->
  <section id="view-flash" class="panel hidden">
    <div class="toolbar">
      <button type="button" class="secondary back-btn" data-back>← 返回</button>
      <span class="spacer"></span>
      <button type="button" class="secondary" id="flash-shuffle">打乱顺序</button>
    </div>
    <div class="flash-alphabet" id="flash-alphabet" aria-label="按首字母筛选"></div>
    <p class="stats" id="flash-stats"></p>
    <div class="progress-bar"><div class="progress-fill" id="flash-progress"></div></div>
    <div class="figure"><img id="flash-img" class="fade-img" alt="" /></div>
    <div class="word-line concealed" id="flash-word" title="点击显示/隐藏单词" data-word="" aria-hidden="true"></div>
    <div class="flash-zh concealed" id="flash-zh" title="点击显示/隐藏"></div>
    <p class="hint">点击图片或英文/中文区域可翻面；隐藏时单词与中文均不可见；按空格键也可显示／隐藏。点字母筛选，再点同一字母取消。</p>
    <div class="btn-row">
      <button type="button" class="secondary" id="flash-prev">上一张</button>
      <button type="button" class="secondary" id="flash-next">下一张</button>
    </div>
  </section>

  <!-- 测验模式 -->
  <section id="view-quiz" class="panel hidden">
    <div class="toolbar">
      <button type="button" class="secondary back-btn" data-back>← 返回</button>
      <span class="spacer"></span>
      <span class="stats" id="quiz-stats"></span>
    </div>
    <div class="figure"><img id="quiz-img" class="fade-img" alt="" /></div>
    <div class="options" id="quiz-options"></div>
    <p id="quiz-msg" class="msg hidden" role="status"></p>
    <div class="btn-row">
      <button type="button" id="quiz-next" class="hidden">下一题</button>
    </div>
  </section>

  <!-- 拼写模式 -->
  <section id="view-spell" class="panel hidden">
    <div class="toolbar">
      <button type="button" class="secondary back-btn" data-back>← 返回</button>
      <span class="spacer"></span>
      <span class="stats" id="spell-stats"></span>
    </div>
    <div class="figure"><img id="spell-img" class="fade-img" alt="" /></div>
    <label class="inline" style="margin-top:0.75rem">
      <input type="checkbox" id="spell-hint-toggle" />
      显示首字母提示
    </label>
    <p id="spell-hint" class="hint hidden"></p>
    <input type="text" id="spell-input" autocomplete="off" spellcheck="false" placeholder="输入完整单词后按 Enter" />
    <p id="spell-msg" class="msg hidden" role="status"></p>
    <p id="spell-answer-line" class="answer-line hidden"></p>
    <div class="btn-row">
      <button type="button" id="spell-submit">提交</button>
      <button type="button" class="secondary" id="spell-skip">下一题</button>
      <button type="button" class="secondary" id="spell-show-answer">查看答案</button>
      <button type="button" class="secondary" id="spell-add-wordbook">加入生词本</button>
    </div>
  </section>

  <!-- 首字母模式 -->
  <section id="view-first" class="panel hidden">
    <div class="toolbar">
      <button type="button" class="secondary back-btn" data-back>← 返回</button>
      <span class="spacer"></span>
      <span class="stats" id="first-stats"></span>
    </div>
    <div class="figure"><img id="first-img" class="fade-img" alt="" /></div>
    <input type="text" id="first-input" autocomplete="off" spellcheck="false" maxlength="8"
           placeholder="输入该词的首字母后按 Enter" />
    <p id="first-msg" class="msg hidden" role="status"></p>
    <p id="first-answer-line" class="answer-line hidden"></p>
    <div class="btn-row">
      <button type="button" id="first-submit">提交</button>
      <button type="button" class="secondary" id="first-skip">下一题</button>
      <button type="button" class="secondary" id="first-show-answer">查看答案</button>
      <button type="button" class="secondary" id="first-add-wordbook">加入生词本</button>
    </div>
  </section>

  <!-- 生词本 -->
  <section id="view-wordbook" class="panel hidden">
    <div class="toolbar">
      <button type="button" class="secondary back-btn" data-back>← 返回</button>
      <span class="spacer"></span>
    </div>
    <h2 class="wordbook-panel-title">生词本</h2>
    <p class="hint" style="text-align:left;">已保存到当前浏览器本地存储（localStorage）。</p>
    <div id="wordbook-list" class="wordbook-list"></div>
  </section>

</div><!-- /.app -->

  const VOCAB = [

  const WORDBOOK_KEY = "pk_wordbook_v1";

  function loadWordbook() {
    try {
      const raw = localStorage.getItem(WORDBOOK_KEY);
      if (!raw) return [];
      const parsed = JSON.parse(raw);
      if (!Array.isArray(parsed)) return [];
      return [...new Set(parsed.filter((w) => typeof w === "string"))];
    } catch {
      return [];
    }
  }

  function saveWordbook(words) {
    const normalized = [...new Set(words.filter((w) => typeof w === "string"))];
    localStorage.setItem(WORDBOOK_KEY, JSON.stringify(normalized));
  }

  function hasInWordbook(word) {
    return loadWordbook().includes(word);
  }

  function addToWordbook(word) {
    const words = loadWordbook();
    if (words.includes(word)) return false;
    words.push(word);
    saveWordbook(words);
    return true;
  }

  function removeFromWordbook(word) {
    const words = loadWordbook().filter((w) => w !== word);
    saveWordbook(words);
  }

  function getWordbookVocabIndices() {
    const wordSet = new Set(loadWordbook());
    const indices = [];
    for (let i = 0; i < VOCAB.length; i += 1) {
      if (wordSet.has(VOCAB[i].word)) indices.push(i);
    }
    return indices;
  }

  function buildPrioritizedQueue() {
    const wb = getWordbookVocabIndices();
    const wbSet = new Set(wb);
    const other = VOCAB.map((_, i) => i).filter((i) => !wbSet.has(i));
    shuffleInPlace(wb);
    shuffleInPlace(other);
    return wb.length ? [...wb, ...other] : shuffleInPlace(VOCAB.map((_, i) => i));
  }

  function pickWeightedVocabIndex() {
    const wb = getWordbookVocabIndices();
    if (wb.length > 0) return wb[randomInt(wb.length)];
    return randomInt(VOCAB.length);
  }

  /* ===== 工具函数 ===== */
  function shuffleInPlace(arr) {
    for (let i = arr.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [arr[i], arr[j]] = [arr[j], arr[i]];
    }
    return arr;
  }

  function randomInt(max) {
    return Math.floor(Math.random() * max);
  }

  function pickDistinctWords(excludeWord, count) {
    const pool = VOCAB.map((e) => e.word).filter((w) => w !== excludeWord);
    shuffleInPlace(pool);
    return pool.slice(0, count);
  }

  const wordbookList = document.getElementById("wordbook-list");

  function escapeHtml(s) {
    return String(s)
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;");
  }

  function renderWordbook() {
    const indices = getWordbookVocabIndices();
    if (!indices.length) {
      wordbookList.innerHTML = '<div class="wordbook-empty">生词本暂时为空。</div>';
      return;
    }
    wordbookList.innerHTML = "";
    indices.forEach((idx) => {
      const entry = VOCAB[idx];
      const word = entry.word;
      const zhRaw = entry.zh != null ? String(entry.zh).trim() : "";
      const zhLine = zhRaw
        ? escapeHtml(zhRaw)
        : "（暂无中文，可在 VOCAB 中为该词添加 zh 字段）";

      const item = document.createElement("div");
      item.className = "wordbook-item";

      const thumb = document.createElement("img");
      thumb.className = "wordbook-thumb";
      thumb.src = entry.file;
      thumb.alt = "";

      const body = document.createElement("div");
      body.className = "wordbook-body";
      body.innerHTML =
        `<div class="wordbook-en">${escapeHtml(word)}</div>` +
        `<div class="wordbook-zh">${zhLine}</div>`;

      const actions = document.createElement("div");
      actions.className = "wordbook-actions";
      const btn = document.createElement("button");
      btn.type = "button";
      btn.className = "secondary";
      btn.textContent = "移除";
      btn.addEventListener("click", () => {
        removeFromWordbook(word);
        renderWordbook();
      });
      actions.appendChild(btn);

      item.appendChild(thumb);
      item.appendChild(body);
      item.appendChild(actions);
      wordbookList.appendChild(item);
    });
  }

  /* ===== 卡片模式 ===== */
  let flashOrder = [];
  let flashPos = 0;
  let flashReveal = false;
  let flashFilterLetter = null;

  const flashImg   = document.getElementById("flash-img");
  const flashWord  = document.getElementById("flash-word");
  const flashZh    = document.getElementById("flash-zh");
  const flashStats = document.getElementById("flash-stats");
  const flashProgress = document.getElementById("flash-progress");
  const flashAlphabet = document.getElementById("flash-alphabet");

  for (let i = 0; i < 26; i += 1) {
    const ch = String.fromCharCode(65 + i);
    const b = document.createElement("button");
    b.type = "button";
    b.className = "flash-letter";
    b.dataset.letter = ch;
    b.textContent = ch;
    b.addEventListener("click", onFlashLetterClick);
    flashAlphabet.appendChild(b);
  }

  function firstFlashLetter(word) {
    const t = (word || "").trim();
    if (!t) return "";
    const c = t.charAt(0).toLowerCase();
    return /[a-z]/.test(c) ? c : "";
  }

  function buildFlashOrder() {
    const all = VOCAB.map((_, idx) => idx);
    const letter = flashFilterLetter ? flashFilterLetter.toLowerCase() : null;
    const pool = letter
      ? all.filter((idx) => firstFlashLetter(VOCAB[idx].word) === letter)
      : all.slice();
    shuffleInPlace(pool);
    return pool;
  }

  function syncFlashLetterButtons() {
    flashAlphabet.querySelectorAll("button.flash-letter").forEach((btn) => {
      btn.classList.toggle("active", btn.dataset.letter === flashFilterLetter);
    });
  }

  function onFlashLetterClick(ev) {
    const btn = ev.target.closest("button.flash-letter");
    if (!btn) return;
    const L = btn.dataset.letter;
    if (flashFilterLetter === L) flashFilterLetter = null;
    else flashFilterLetter = L;
    syncFlashLetterButtons();
    const next = buildFlashOrder();
    if (!next.length) {
      flashFilterLetter = null;
      syncFlashLetterButtons();
      flashOrder = buildFlashOrder();
      flashPos = 0;
      flashReveal = false;
      renderFlash();
      flashStats.textContent = "该首字母下暂无单词，已取消筛选。";
      return;
    }
    flashOrder = next;
    flashPos = 0;
    flashReveal = false;
    renderFlash();
  }

  function renderFlash() {
    if (!flashOrder.length) {
      flashWord.textContent = "";
      flashWord.dataset.word = "";
      flashWord.dataset.zh = "";
      flashWord.classList.add("concealed");
      flashWord.setAttribute("aria-hidden", "true");
      flashZh.textContent = "";
      flashZh.classList.add("concealed");
      flashStats.textContent = "当前没有可显示的卡片。";
      flashProgress.style.width = "0%";
      return;
    }
    const e = VOCAB[flashOrder[flashPos]];
    setImageWithFade(flashImg, e.file, e.word);
    flashWord.dataset.word = e.word;
    flashWord.dataset.zh = e.zh != null ? String(e.zh) : "";
    flashZh.dataset.zh = flashWord.dataset.zh;
    if (flashReveal) {
      flashWord.textContent = e.word;
      flashWord.classList.remove("concealed");
      flashWord.setAttribute("aria-hidden", "false");
      flashZh.textContent = flashZh.dataset.zh || "";
      flashZh.classList.remove("concealed");
    } else {
      flashWord.textContent = "";
      flashWord.classList.add("concealed");
      flashWord.setAttribute("aria-hidden", "true");
      flashZh.textContent = "";
      flashZh.classList.add("concealed");
    }
    flashStats.textContent = `第 ${flashPos + 1} / ${flashOrder.length} 张`;
    flashProgress.style.width = `${((flashPos + 1) / flashOrder.length) * 100}%`;
  }

  function startFlash() {
    flashFilterLetter = null;
    syncFlashLetterButtons();
    flashOrder = buildFlashOrder();
    flashPos = 0;
    flashReveal = false;
    showView("flash");
    renderFlash();
  }

  document.getElementById("flash-shuffle").addEventListener("click", () => {
    if (!flashOrder.length) return;
    shuffleInPlace(flashOrder);
    flashPos = 0;
    flashReveal = false;
    renderFlash();
  });

  document.getElementById("flash-prev").addEventListener("click", () => {
    if (!flashOrder.length) return;
    flashPos = (flashPos - 1 + flashOrder.length) % flashOrder.length;
    flashReveal = false;
    renderFlash();
  });

  document.getElementById("flash-next").addEventListener("click", () => {
    if (!flashOrder.length) return;
    flashPos = (flashPos + 1) % flashOrder.length;
    flashReveal = false;
    renderFlash();
  });

  function toggleFlashReveal() {
    if (!flashOrder.length) return;
    flashReveal = !flashReveal;
    const w = flashWord.dataset.word || "";
    const z = flashZh.dataset.zh || "";
    if (flashReveal) {
      flashWord.textContent = w;
      flashWord.classList.remove("concealed");
      flashWord.setAttribute("aria-hidden", "false");
      flashZh.textContent = z;
      flashZh.classList.remove("concealed");
    } else {
      flashWord.textContent = "";
      flashWord.classList.add("concealed");
      flashWord.setAttribute("aria-hidden", "true");
      flashZh.textContent = "";
      flashZh.classList.add("concealed");
    }
  }

  flashWord.addEventListener("click", toggleFlashReveal);
  flashZh.addEventListener("click", toggleFlashReveal);
  flashImg.addEventListener("click",  toggleFlashReveal);

  document.addEventListener("keydown", (ev) => {
    if (views.flash.classList.contains("hidden")) return;
    if (!flashOrder.length) return;
    if (ev.key === "ArrowLeft")  { ev.preventDefault(); document.getElementById("flash-prev").click(); }
    if (ev.key === "ArrowRight") { ev.preventDefault(); document.getElementById("flash-next").click(); }
    if (ev.key === " " || ev.code === "Space") {
      ev.preventDefault();
      toggleFlashReveal();
    }
  });

  /* ===== 测验模式 ===== */
  let quizCorrect  = 0;
  let quizTotal    = 0;
  let quizCurrent  = null;
  let quizAnswered = false;

  const quizImg     = document.getElementById("quiz-img");
  const quizOptions = document.getElementById("quiz-options");
  const quizMsg     = document.getElementById("quiz-msg");
  const quizNext    = document.getElementById("quiz-next");
  const quizStatsEl = document.getElementById("quiz-stats");

  function updateQuizStats() {
    quizStatsEl.textContent = quizTotal
      ? `本轮 ${quizCorrect} / ${quizTotal} 正确`
      : "本轮尚未答题";
  }

  function buildQuizQuestion() {
    quizAnswered = false;
    quizMsg.classList.add("hidden");
    quizNext.classList.add("hidden");
    quizOptions.innerHTML = "";

    const idx = pickWeightedVocabIndex();
    quizCurrent = VOCAB[idx];
    setImageWithFade(quizImg, quizCurrent.file, quizCurrent.word);

    const need = Math.min(3, VOCAB.length - 1);
    const wrong = pickDistinctWords(quizCurrent.word, need);
    const choices = shuffleInPlace([quizCurrent.word, ...wrong]);

    choices.forEach((w) => {
      const b = document.createElement("button");
      b.type = "button";
      b.className = "option";
      b.textContent = w;
      b.addEventListener("click", () => onQuizPick(w, b));
      quizOptions.appendChild(b);
    });
  }

  function onQuizPick(word, btn) {
    if (quizAnswered) return;
    quizAnswered = true;
    quizTotal += 1;
    const ok = word === quizCurrent.word;
    if (ok) quizCorrect += 1;
    updateQuizStats();

    quizOptions.querySelectorAll("button.option").forEach((el) => {
      el.disabled = true;
      if (el.textContent === quizCurrent.word) el.classList.add("correct");
    });
    if (!ok) {
      btn.classList.add("wrong");
      quizMsg.textContent = `再想想。正确答案是：${quizCurrent.word}`;
      quizMsg.className = "msg bad";
    } else {
      quizMsg.textContent = "回答正确！";
      quizMsg.className = "msg ok";
    }
    quizMsg.classList.remove("hidden");
    quizNext.classList.remove("hidden");
  }

  function startQuiz() {
    quizCorrect = 0;
    quizTotal   = 0;
    updateQuizStats();
    showView("quiz");
    buildQuizQuestion();
  }

  document.getElementById("quiz-next").addEventListener("click", buildQuizQuestion);

  /* ===== 拼写模式 ===== */
  let spellQueue   = [];
  let spellIndex   = 0;
  let spellCurrent = null;
  let spellCorrect = 0;
  let spellAttempts = 0;
  let spellCountedThisQuestion = false;

  const spellImg         = document.getElementById("spell-img");
  const spellInput       = document.getElementById("spell-input");
  const spellMsg         = document.getElementById("spell-msg");
  const spellStats       = document.getElementById("spell-stats");
  const spellHintToggle  = document.getElementById("spell-hint-toggle");
  const spellHint        = document.getElementById("spell-hint");

  function updateSpellStats() {
    spellStats.textContent = spellAttempts
      ? `本轮 ${spellCorrect} / ${spellAttempts} 正确`
      : "本轮尚未提交";
  }

  function updateSpellHint() {
    if (spellHintToggle.checked && spellCurrent) {
      spellHint.textContent = `提示：首字母为 "${spellCurrent.word.charAt(0)}"`;
      spellHint.classList.remove("hidden");
    } else {
      spellHint.classList.add("hidden");
    }
  }

  function nextSpellWord() {
    spellCountedThisQuestion = false;
    spellMsg.classList.add("hidden");
    spellInput.value = "";
    if (!spellQueue.length || spellIndex >= spellQueue.length) {
      spellQueue = buildPrioritizedQueue();
      spellIndex = 0;
    }
    spellCurrent = VOCAB[spellQueue[spellIndex++]];
    setImageWithFade(spellImg, spellCurrent.file, spellCurrent.word);
    updateSpellHint();
    spellAnswerLine.classList.add("hidden");
    spellInput.focus();
  }

  function checkSpell() {
    if (!spellCurrent) return;
    const guess  = spellInput.value.trim().toLowerCase();
    const target = spellCurrent.word.trim().toLowerCase();
    if (guess === target) {
      spellAttempts += 1;
      spellCorrect += 1;
      spellMsg.textContent = "正确！";
      spellMsg.className = "msg ok";
      spellMsg.classList.remove("hidden");
      updateSpellStats();
      nextSpellWord();
      return;
    }
    if (!spellCountedThisQuestion) {
      spellAttempts += 1;
      spellCountedThisQuestion = true;
    }
    spellMsg.textContent = "不对，再试一次。";
    spellMsg.className = "msg bad";
    spellMsg.classList.remove("hidden");
    updateSpellStats();
  }

  function startSpell() {
    spellQueue    = [];
    spellIndex    = 0;
    spellCorrect  = 0;
    spellAttempts = 0;
    updateSpellStats();
    showView("spell");
    nextSpellWord();
  }

  spellHintToggle.addEventListener("change", updateSpellHint);
  document.getElementById("spell-submit").addEventListener("click", checkSpell);
  document.getElementById("spell-skip").addEventListener("click", nextSpellWord);
  const spellAnswerLine = document.getElementById("spell-answer-line");
  document.getElementById("spell-show-answer").addEventListener("click", () => {
    if (!spellCurrent) return;
    spellAnswerLine.textContent = `答案：${spellCurrent.word}`;
    spellAnswerLine.classList.remove("hidden");
  });
  document.getElementById("spell-add-wordbook").addEventListener("click", () => {
    if (!spellCurrent) return;
    const added = addToWordbook(spellCurrent.word);
    spellMsg.textContent = added ? "已加入生词本。" : "该单词已在生词本中。";
    spellMsg.className = added ? "msg ok" : "msg bad";
    spellMsg.classList.remove("hidden");
  });
  spellInput.addEventListener("keydown", (ev) => {
    if (ev.key === "Enter") { ev.preventDefault(); checkSpell(); }
  });

  /* ===== 首字母模式 ===== */
  let firstQueue    = [];
  let firstIndex    = 0;
  let firstCurrent  = null;
  let firstCorrect  = 0;
  let firstAttempts = 0;
  let firstCountedThisQuestion = false;

  const firstImg   = document.getElementById("first-img");
  const firstInput = document.getElementById("first-input");
  const firstMsg   = document.getElementById("first-msg");
  const firstStats = document.getElementById("first-stats");

  function updateFirstStats() {
    firstStats.textContent = firstAttempts
      ? `本轮 ${firstCorrect} / ${firstAttempts} 正确`
      : "本轮尚未提交";
  }

  function nextFirstWord() {
    firstCountedThisQuestion = false;
    firstMsg.classList.add("hidden");
    firstInput.value = "";
    if (!firstQueue.length || firstIndex >= firstQueue.length) {
      firstQueue = buildPrioritizedQueue();
      firstIndex = 0;
    }
    firstCurrent = VOCAB[firstQueue[firstIndex++]];
    setImageWithFade(firstImg, firstCurrent.file, firstCurrent.word);
    firstAnswerLine.classList.add("hidden");
    firstInput.focus();
  }

  function checkFirst() {
    if (!firstCurrent) return;
    const raw = firstInput.value.trim();
    if (!raw) {
      firstMsg.textContent = "请输入至少一个字符。";
      firstMsg.className = "msg bad";
      firstMsg.classList.remove("hidden");
      return;
    }
    const g      = raw.charAt(0).toLowerCase();
    const target = firstCurrent.word.charAt(0).toLowerCase();
    if (g === target) {
      firstAttempts += 1;
      firstCorrect += 1;
      firstMsg.textContent = "正确！";
      firstMsg.className = "msg ok";
      firstMsg.classList.remove("hidden");
      updateFirstStats();
      nextFirstWord();
      return;
    }
    if (!firstCountedThisQuestion) {
      firstAttempts += 1;
      firstCountedThisQuestion = true;
    }
    firstMsg.textContent = "不对，再试一次。";
    firstMsg.className = "msg bad";
    firstMsg.classList.remove("hidden");
    updateFirstStats();
  }

  function startFirst() {
    firstQueue    = [];
    firstIndex    = 0;
    firstCorrect  = 0;
    firstAttempts = 0;
    updateFirstStats();
    showView("first");
    nextFirstWord();
  }

  document.getElementById("first-submit").addEventListener("click", checkFirst);
  document.getElementById("first-skip").addEventListener("click", nextFirstWord);
  const firstAnswerLine = document.getElementById("first-answer-line");
  document.getElementById("first-show-answer").addEventListener("click", () => {
    if (!firstCurrent) return;
    firstAnswerLine.textContent = `答案：${firstCurrent.word}`;
    firstAnswerLine.classList.remove("hidden");
  });
  document.getElementById("first-add-wordbook").addEventListener("click", () => {
    if (!firstCurrent) return;
    const added = addToWordbook(firstCurrent.word);
    firstMsg.textContent = added ? "已加入生词本。" : "该单词已在生词本中。";
    firstMsg.className = added ? "msg ok" : "msg bad";
    firstMsg.classList.remove("hidden");
  });
  firstInput.addEventListener("keydown", (ev) => {
    if (ev.key === "Enter") { ev.preventDefault(); checkFirst(); }
  });
</script>
</body>
