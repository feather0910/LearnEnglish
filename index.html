<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>单词图片学习</title>
  <style>
    @import url("https://fonts.googleapis.com/css2?family=Nunito:wght@500;700;800&display=swap");
    :root {
      --bg: #fff7ed;
      --bg-accent: #eff6ff;
      --card: #ffffff;
      --text: #1f2937;
      --muted: #64748b;
      --accent: #f97316;
      --accent-2: #fb923c;
      --accent-hover: #ea580c;
      --danger: #ef4444;
      --ok: #22c55e;
      --border: #fed7aa;
      --radius: 18px;
      --pill: 9999px;
      --shadow: 0 16px 36px rgba(249, 115, 22, 0.12);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "Nunito", system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background: linear-gradient(135deg, var(--bg) 0%, var(--bg-accent) 100%);
      color: var(--text);
      line-height: 1.5;
      min-height: 100vh;
      border-top: 4px solid var(--accent);
    }
    .app {
      max-width: 640px;
      margin: 0 auto;
      padding: 1rem 1rem 2rem;
    }
    h1 {
      font-size: 1.65rem;
      font-weight: 800;
      margin: 0 0 0.35rem;
    }
    p.lead {
      margin: 0 0 1.25rem;
      color: var(--muted);
      font-size: 1rem;
    }
    .panel {
      background: var(--card);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      border: 1px solid var(--border);
      padding: 1.25rem;
    }
    .hidden { display: none !important; }
    .btn-row {
      display: flex;
      flex-wrap: wrap;
      gap: 0.6rem;
      margin-top: 0.9rem;
    }
    button {
      font: inherit;
      font-weight: 700;
      cursor: pointer;
      border: none;
      border-radius: var(--pill);
      padding: 0.7rem 1.05rem;
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
      color: #fff;
      box-shadow: 0 8px 16px rgba(249, 115, 22, 0.25);
      transition: transform 0.15s ease, filter 0.15s ease, box-shadow 0.15s ease;
    }
    button:hover {
      filter: brightness(1.05);
      box-shadow: 0 10px 20px rgba(249, 115, 22, 0.35);
    }
    button:active { transform: scale(0.96); }
    button.secondary {
      background: #f8fafc;
      color: var(--text);
      border: 1px solid #e2e8f0;
      box-shadow: none;
    }
    button.secondary:hover { background: #eef2ff; }
    button:disabled {
      opacity: 0.55;
      cursor: not-allowed;
      filter: grayscale(0.2);
      box-shadow: none;
    }
    .home-hero {
      text-align: center;
      margin-bottom: 1rem;
    }
    .hero-emoji {
      font-size: 2.1rem;
      margin-bottom: 0.2rem;
    }
    .modes {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 0.7rem;
    }
    .mode-card {
      border-radius: 16px;
      padding: 0.85rem;
      text-align: left;
      min-height: 106px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 0.15rem;
      background: #fff;
      color: var(--text);
      border: 1px solid #fde68a;
      box-shadow: 0 8px 18px rgba(251, 146, 60, 0.18);
    }
    .mode-icon { font-size: 1.3rem; }
    .mode-title { font-size: 1rem; font-weight: 800; }
    .mode-desc { font-size: 0.84rem; color: var(--muted); font-weight: 600; }
    .toolbar {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 0.5rem;
      margin-bottom: 1rem;
    }
    .toolbar .spacer { flex: 1; }
    .back-btn { padding-inline: 0.75rem; }
    .flash-alphabet {
      display: flex;
      flex-wrap: wrap;
      gap: 0.35rem;
      margin-bottom: 0.75rem;
      justify-content: center;
    }
    .flash-alphabet button.flash-letter {
      min-width: 2rem;
      padding: 0.35rem 0.4rem;
      font-size: 0.78rem;
      font-weight: 800;
      border-radius: 8px;
      background: #fff7ed;
      color: var(--text);
      border: 1px solid #fdba74;
      box-shadow: none;
    }
    .flash-alphabet button.flash-letter:hover {
      background: #ffedd5;
      filter: none;
    }
    .flash-alphabet button.flash-letter.active {
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
      color: #fff;
      border-color: transparent;
    }
    .flash-zh {
      margin-top: 0.35rem;
      font-size: 1.05rem;
      font-weight: 700;
      text-align: center;
      color: #9a3412;
      min-height: 1.5rem;
      letter-spacing: 0.02em;
    }
    .flash-zh.concealed {
      visibility: hidden;
      min-height: 1.5rem;
    }
    .progress-bar {
      width: 100%;
      height: 10px;
      background: #ffedd5;
      border-radius: var(--pill);
      overflow: hidden;
      border: 1px solid #fdba74;
      margin-bottom: 0.6rem;
    }
    .progress-fill {
      width: 0%;
      height: 100%;
      background: linear-gradient(90deg, #f97316, #fb923c);
      transition: width 0.25s ease;
    }
    .figure {
      border-radius: var(--radius);
      overflow: hidden;
      background: linear-gradient(145deg, #fff1cc, #dbeafe);
      border: 1px solid var(--border);
      aspect-ratio: 1 / 1;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .figure img {
      max-width: 100%;
      max-height: 100%;
      width: auto;
      height: auto;
      object-fit: contain;
      display: block;
    }
    /* 拼写、首字母：主图区域较扁（沿用） */
    .figure.figure--short {
      aspect-ratio: 2 / 1;
    }
    /* 素材按 256×256：看图选词题干区缩小展示（正方形，边长约 200px） */
    .figure.figure--quiz-word {
      aspect-ratio: 1 / 1;
      width: min(200px, 85vw);
      max-width: 100%;
      margin-inline: auto;
      height: auto;
    }
    /* 素材按 256×256：卡片模式主图缩小展示 */
    .figure.figure--flash {
      aspect-ratio: 1 / 1;
      width: min(200px, 85vw);
      max-width: 100%;
      margin-inline: auto;
      height: auto;
    }
    .fade-img {
      opacity: 1;
      transition: opacity 0.25s ease;
    }
    .fade-img.fading { opacity: 0; }
    .word-line {
      margin-top: 1rem;
      font-size: 2rem;
      font-weight: 800;
      text-align: center;
      min-height: 2.5rem;
      letter-spacing: 0.03em;
      text-shadow: 0 2px 12px rgba(249, 115, 22, 0.25);
    }
    .word-line.concealed {
      color: transparent;
      text-shadow: none;
      user-select: none;
      cursor: pointer;
    }
    .hint {
      font-size: 0.9rem;
      color: var(--muted);
      text-align: center;
      margin-top: 0.35rem;
      font-weight: 600;
    }
    .stats {
      font-size: 0.95rem;
      color: var(--muted);
      margin-top: 0.5rem;
      font-weight: 700;
    }
    .msg {
      margin-top: 0.75rem;
      padding: 0.7rem 0.85rem;
      border-radius: 12px;
      border: 1px solid var(--border);
      font-size: 0.98rem;
      font-weight: 700;
    }
    .msg.ok {
      border-color: #86efac;
      background: #f0fdf4;
      color: #166534;
      animation: pop 0.28s ease;
    }
    .msg.bad {
      border-color: #fecaca;
      background: #fef2f2;
      color: #991b1b;
      animation: shake 0.28s ease;
    }
    label.inline {
      display: flex;
      align-items: center;
      gap: 0.4rem;
      font-size: 0.95rem;
      color: var(--muted);
      user-select: none;
      font-weight: 700;
    }
    input[type="text"] {
      width: 100%;
      font: inherit;
      font-size: 1.02rem;
      padding: 0.75rem 0.85rem;
      border-radius: 14px;
      border: 1px solid #fed7aa;
      margin-top: 0.75rem;
      transition: box-shadow 0.2s ease, border-color 0.2s ease;
    }
    input[type="text"]:focus {
      outline: none;
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(249, 115, 22, 0.22);
    }
    .options {
      display: grid;
      gap: 0.55rem;
      margin-top: 0.75rem;
    }
    .options--quiz-words button.option {
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
    }
    .options button.option {
      background: #fff;
      color: var(--text);
      border: 2px solid #fed7aa;
      text-align: left;
      border-radius: 14px;
      box-shadow: none;
      transition: border-color 0.15s ease, background 0.15s ease, transform 0.15s ease;
    }
    .options button.option:hover:not(:disabled) {
      border-color: var(--accent);
      background: #fff7ed;
    }
    .options button.option.correct {
      border-color: #22c55e;
      background: #f0fdf4;
    }
    .options button.option.wrong {
      border-color: #ef4444;
      background: #fef2f2;
    }
    .empty {
      color: var(--muted);
      font-size: 0.95rem;
    }
    .wordbook-entry {
      margin-top: 0.8rem;
    }
    .wordbook-panel-title {
      margin: 0 0 0.35rem;
      font-size: 1.3rem;
      font-weight: 800;
    }
    .wordbook-list {
      margin-top: 0.9rem;
      display: grid;
      gap: 0.5rem;
    }
    .wordbook-item {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      padding: 0.65rem 0.75rem;
      border: 1px solid #fed7aa;
      background: #fff7ed;
      border-radius: 12px;
      font-weight: 700;
    }
    .wordbook-thumb {
      width: 64px;
      height: 64px;
      object-fit: cover;
      border-radius: 10px;
      flex-shrink: 0;
      border: 1px solid #fdba74;
      background: #fff;
    }
    .wordbook-body {
      flex: 1;
      min-width: 0;
    }
    .wordbook-en {
      font-weight: 800;
      overflow-wrap: anywhere;
    }
    .wordbook-zh {
      font-size: 0.88rem;
      font-weight: 700;
      color: var(--muted);
      margin-top: 0.15rem;
      overflow-wrap: anywhere;
    }
    .wordbook-actions {
      flex-shrink: 0;
    }
    .wordbook-empty {
      color: var(--muted);
      background: #fff7ed;
      border: 1px dashed #fdba74;
      border-radius: 12px;
      padding: 0.7rem 0.8rem;
      font-weight: 700;
    }
    .answer-line {
      margin-top: 0.55rem;
      padding: 0.55rem 0.65rem;
      border-radius: 10px;
      border: 1px solid #fdba74;
      background: #fff7ed;
      color: #9a3412;
      font-weight: 800;
      font-size: 0.95rem;
    }
    @keyframes pop {
      0% { transform: scale(0.8); }
      70% { transform: scale(1.05); }
      100% { transform: scale(1); }
    }
    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      25% { transform: translateX(-6px); }
      50% { transform: translateX(6px); }
      75% { transform: translateX(-4px); }
    }
    @keyframes flip360 {
      0% { transform: rotateY(0deg); }
      100% { transform: rotateY(360deg); }
    }
    .figure.flash-anim {
      animation: flip360 0.55s ease;
      transform-style: preserve-3d;
    }
    .home-settings {
      margin-top: 1rem;
      padding: 0.75rem 0.85rem;
      border-radius: 14px;
      border: 1px dashed #fdba74;
      background: #fffbeb;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 0.65rem 1rem;
      font-size: 0.92rem;
      font-weight: 700;
      color: var(--muted);
    }
    .home-settings label.inline { margin: 0; }
    .round-prompt-word {
      font-size: clamp(1.6rem, 6vw, 2.35rem);
      font-weight: 800;
      text-align: center;
      margin: 0.5rem 0 0.25rem;
      letter-spacing: 0.02em;
      line-height: 1.2;
    }
    .options-grid-images {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 0.65rem;
      margin-top: 0.75rem;
    }
    /* 看词选图：选项格为 256×256 素材预留更高区域（相对原先约 110px 接近翻倍），图片不超过 256 */
    #view-quiz-image button.option-image {
      min-height: 232px;
      padding: 0.45rem;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 16px;
      background: #fff;
      border: 2px solid #fed7aa;
    }
    #view-quiz-image button.option-image img {
      max-width: min(256px, 100%);
      max-height: min(256px, 42vw);
      width: auto;
      height: auto;
      object-fit: contain;
      border-radius: 10px;
    }
    button.option-image.correct {
      border-color: #22c55e;
      background: #f0fdf4;
    }
    button.option-image.wrong {
      border-color: #ef4444;
      background: #fef2f2;
    }
    .options button.option {
      min-height: 48px;
      padding: 0.55rem 0.85rem;
      font-size: 1.02rem;
    }
    .streak-line {
      font-size: 0.9rem;
      font-weight: 800;
      color: #c2410c;
      margin-top: 0.25rem;
      min-height: 1.35rem;
    }
    .confetti-root {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 50;
      overflow: hidden;
    }
    .confetti-piece {
      position: absolute;
      top: -12px;
      width: 8px;
      height: 12px;
      border-radius: 2px;
      opacity: 0.95;
      animation: confetti-fall 1.1s ease-out forwards;
    }
    @keyframes confetti-fall {
      to {
        transform: translate(var(--dx), 100vh) rotate(720deg);
        opacity: 0.35;
      }
    }
    .round-overlay {
      position: fixed;
      inset: 0;
      background: rgba(15, 23, 42, 0.45);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 40;
      padding: 1rem;
    }
    .round-overlay-inner {
      background: #fff;
      border-radius: 20px;
      padding: 1.35rem 1.25rem;
      max-width: 360px;
      width: 100%;
      text-align: center;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.18);
      border: 2px solid #fed7aa;
    }
    .round-overlay-inner h3 {
      margin: 0 0 0.5rem;
      font-size: 1.35rem;
      font-weight: 800;
    }
    .round-overlay-inner p { margin: 0 0 1rem; color: var(--muted); font-weight: 700; }
    .round-overlay-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
      justify-content: center;
    }
    @media (max-width: 520px) {
      .modes { grid-template-columns: 1fr; }
      .mode-card { min-height: 96px; }
    }
  </style>
</head>
<body>
<div class="app">

  <!-- 首页 -->
  <section id="view-home" class="panel">
    <div class="home-hero">
      <div class="hero-emoji">🌈📚🧠</div>
      <h1>单词图片学习</h1>
      <p class="lead">图片放在与本页同级的 <code>images</code> 文件夹，在脚本里编辑 <code>VOCAB</code> 词表，双击本页即可使用。</p>
    </div>
    <p id="home-empty" class="empty hidden">词表为空：请先在 <code>VOCAB</code> 中添加条目。</p>
    <div class="modes">
      <button type="button" id="go-flash" class="mode-card">
        <span class="mode-icon">🃏</span>
        <span class="mode-title">卡片模式</span>
        <span class="mode-desc">看图记词，点击翻面</span>
      </button>
      <button type="button" id="go-quiz-word" class="mode-card">
        <span class="mode-icon">🎯</span>
        <span class="mode-title">看图选词</span>
        <span class="mode-desc">每轮 20 题，先练没测过的词</span>
      </button>
      <button type="button" id="go-quiz-image" class="mode-card">
        <span class="mode-icon">🖼️</span>
        <span class="mode-title">看词选图</span>
        <span class="mode-desc">认单词，点对应图片</span>
      </button>
      <button type="button" id="go-spell" class="mode-card">
        <span class="mode-icon">✍️</span>
        <span class="mode-title">拼写模式</span>
        <span class="mode-desc">每轮 20 词，输入完整单词</span>
      </button>
      <button type="button" id="go-first" class="mode-card">
        <span class="mode-icon">🔤</span>
        <span class="mode-title">首字母模式</span>
        <span class="mode-desc">每轮 20 词，输入首字母</span>
      </button>
    </div>
    <div class="home-settings">
      <label class="inline">
        <input type="checkbox" id="setting-auto-next" />
        答对自动下一题
      </label>
      <button type="button" class="secondary" id="reset-seen-words">清空已测记录</button>
    </div>
    <div class="wordbook-entry">
      <button type="button" id="go-wordbook" class="secondary">生词本</button>
    </div>
  </section>

  <!-- 卡片模式 -->
  <section id="view-flash" class="panel hidden">
    <div class="toolbar">
      <button type="button" class="secondary back-btn" data-back>← 返回</button>
      <span class="spacer"></span>
      <button type="button" class="secondary" id="flash-shuffle">打乱顺序</button>
    </div>
    <div class="flash-alphabet" id="flash-alphabet" aria-label="按首字母筛选"></div>
    <p class="stats" id="flash-stats"></p>
    <div class="progress-bar"><div class="progress-fill" id="flash-progress"></div></div>
    <div class="figure figure--flash" id="flash-figure"><img id="flash-img" class="fade-img" alt="" /></div>
    <div class="word-line concealed" id="flash-word" title="点击显示/隐藏单词" data-word="" aria-hidden="true"></div>
    <div class="flash-zh concealed" id="flash-zh" title="点击显示/隐藏"></div>
    <p class="hint">点击图片或英文/中文区域可翻面；隐藏时单词与中文均不可见；按空格键也可显示／隐藏。点字母筛选，再点同一字母取消。</p>
    <div class="btn-row">
      <button type="button" class="secondary" id="flash-prev">上一张</button>
      <button type="button" class="secondary" id="flash-next">下一张</button>
    </div>
  </section>

  <!-- 看图选词 -->
  <section id="view-quiz-word" class="panel hidden">
    <div class="toolbar">
      <button type="button" class="secondary back-btn" data-back>← 返回</button>
      <span class="spacer"></span>
      <span class="stats" id="quiz-word-stats"></span>
    </div>
    <p class="streak-line" id="quiz-word-streak" aria-live="polite"></p>
    <div class="figure figure--quiz-word" id="quiz-word-figure"><img id="quiz-word-img" class="fade-img" alt="" /></div>
    <div class="options options--quiz-words" id="quiz-word-options"></div>
    <p id="quiz-word-msg" class="msg hidden" role="status"></p>
    <div class="btn-row">
      <button type="button" id="quiz-word-next" class="hidden">下一题</button>
    </div>
  </section>

  <!-- 看词选图 -->
  <section id="view-quiz-image" class="panel hidden">
    <div class="toolbar">
      <button type="button" class="secondary back-btn" data-back>← 返回</button>
      <span class="spacer"></span>
      <span class="stats" id="quiz-image-stats"></span>
    </div>
    <p class="streak-line" id="quiz-image-streak" aria-live="polite"></p>
    <p class="round-prompt-word" id="quiz-image-prompt"></p>
    <div class="options-grid-images" id="quiz-image-options"></div>
    <p id="quiz-image-msg" class="msg hidden" role="status"></p>
    <div class="btn-row">
      <button type="button" id="quiz-image-next" class="hidden">下一题</button>
    </div>
  </section>

  <!-- 拼写模式 -->
  <section id="view-spell" class="panel hidden">
    <div class="toolbar">
      <button type="button" class="secondary back-btn" data-back>← 返回</button>
      <span class="spacer"></span>
      <span class="stats" id="spell-stats"></span>
    </div>
    <p class="streak-line" id="spell-streak" aria-live="polite"></p>
    <div class="figure figure--short"><img id="spell-img" class="fade-img" alt="" /></div>
    <label class="inline" style="margin-top:0.75rem">
      <input type="checkbox" id="spell-hint-toggle" checked />
      显示首字母提示
    </label>
    <p id="spell-hint" class="hint hidden"></p>
    <input type="text" id="spell-input" autocomplete="off" spellcheck="false" placeholder="输入完整单词后按 Enter" />
    <p id="spell-msg" class="msg hidden" role="status"></p>
    <p id="spell-answer-line" class="answer-line hidden"></p>
    <div class="btn-row">
      <button type="button" id="spell-submit">提交</button>
      <button type="button" id="spell-continue" class="hidden">下一题</button>
      <button type="button" class="secondary" id="spell-skip">跳过</button>
      <button type="button" class="secondary" id="spell-show-answer">查看答案</button>
      <button type="button" class="secondary" id="spell-add-wordbook">加入生词本</button>
    </div>
  </section>

  <!-- 首字母模式 -->
  <section id="view-first" class="panel hidden">
    <div class="toolbar">
      <button type="button" class="secondary back-btn" data-back>← 返回</button>
      <span class="spacer"></span>
      <span class="stats" id="first-stats"></span>

  const WORDBOOK_KEY = "pk_wordbook_v1";
  const SEEN_WORDS_KEY = "pk_seen_quiz_spell_first_v1";
  const SETTINGS_KEY = "pk_settings_v1";
  const ROUND_SIZE = 20;

  function loadSettings() {
    try {
      const raw = localStorage.getItem(SETTINGS_KEY);
      if (!raw) return { autoNext: true };
      const o = JSON.parse(raw);
      return {
        autoNext: o && typeof o.autoNext === "boolean" ? o.autoNext : true,
      };
    } catch {
      return { autoNext: true };
    }
  }

  function saveSettings(s) {
    localStorage.setItem(SETTINGS_KEY, JSON.stringify(s));
  }

  function loadSeenWords() {
    try {
      const raw = localStorage.getItem(SEEN_WORDS_KEY);
      if (!raw) return new Set();
      const a = JSON.parse(raw);
      if (!Array.isArray(a)) return new Set();
      return new Set(a.filter((w) => typeof w === "string"));
    } catch {
      return new Set();
    }
  }

  function saveSeenWords(set) {
    localStorage.setItem(SEEN_WORDS_KEY, JSON.stringify([...set]));
  }

  function markWordSeen(word) {
    const s = loadSeenWords();
    if (s.has(word)) return;
    s.add(word);
    saveSeenWords(s);
  }

  /** 生词本未测优先，再其余未测，凑满 ROUND_SIZE 后用已测补足 */
  function buildRoundQueueIndices() {
    const seen = loadSeenWords();
    const wbWords = new Set(loadWordbook());
    const all = VOCAB.map((_, i) => i);
    const untested = all.filter((i) => !seen.has(VOCAB[i].word));
    const tested = all.filter((i) => seen.has(VOCAB[i].word));
    const wbU = shuffleInPlace(untested.filter((i) => wbWords.has(VOCAB[i].word)));
    const restU = shuffleInPlace(untested.filter((i) => !wbWords.has(VOCAB[i].word)));
    const orderedUntested = [...wbU, ...restU];
    shuffleInPlace(tested);
    const cap = Math.min(ROUND_SIZE, VOCAB.length);
    const out = [];
    for (const i of orderedUntested) {
      if (out.length >= cap) break;
      out.push(i);
    }
    for (const i of tested) {
      if (out.length >= cap) break;
      out.push(i);
    }
    return out;
  }

  function pickDistinctIndices(excludeIdx, count) {
    const pool = VOCAB.map((_, i) => i).filter((i) => i !== excludeIdx);

  function loadWordbook() {
    try {
      const raw = localStorage.getItem(WORDBOOK_KEY);
      if (!raw) return [];
      const parsed = JSON.parse(raw);
      if (!Array.isArray(parsed)) return [];
      return [...new Set(parsed.filter((w) => typeof w === "string"))];
    } catch {
      return [];
    }
  }

  function saveWordbook(words) {
    const normalized = [...new Set(words.filter((w) => typeof w === "string"))];
    localStorage.setItem(WORDBOOK_KEY, JSON.stringify(normalized));
  }

  function hasInWordbook(word) {
    return loadWordbook().includes(word);
  }

  function addToWordbook(word) {
    const words = loadWordbook();
    if (words.includes(word)) return false;
    words.push(word);
    saveWordbook(words);
    return true;
  }

  function removeFromWordbook(word) {
    const words = loadWordbook().filter((w) => w !== word);
    saveWordbook(words);
  }

  function getWordbookVocabIndices() {
    const wordSet = new Set(loadWordbook());
    const indices = [];
    for (let i = 0; i < VOCAB.length; i += 1) {
      if (wordSet.has(VOCAB[i].word)) indices.push(i);
    }
    return indices;
  }

  function buildPrioritizedQueue() {
    const wb = getWordbookVocabIndices();
    const wbSet = new Set(wb);
    const other = VOCAB.map((_, i) => i).filter((i) => !wbSet.has(i));
    shuffleInPlace(wb);
    shuffleInPlace(other);
    return wb.length ? [...wb, ...other] : shuffleInPlace(VOCAB.map((_, i) => i));
  }

  /* ===== 工具函数 ===== */
  function shuffleInPlace(arr) {
    for (let i = arr.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [arr[i], arr[j]] = [arr[j], arr[i]];
    }
    return arr;
  }

  function randomInt(max) {
    return Math.floor(Math.random() * max);
  }

  function pickDistinctWords(excludeWord, count) {
    const pool = VOCAB.map((e) => e.word).filter((w) => w !== excludeWord);
    shuffleInPlace(pool);
    return pool.slice(0, count);
  }

      .replace(/>/g, "&gt;")

  function firstFlashLetter(word) {
    const t = (word || "").trim();
    if (!t) return "";
    const c = t.charAt(0).toLowerCase();
    return /[a-z]/.test(c) ? c : "";
  }

  function buildFlashOrder() {
    const all = VOCAB.map((_, idx) => idx);
    const letter = flashFilterLetter ? flashFilterLetter.toLowerCase() : null;
    const pool = letter
      ? all.filter((idx) => firstFlashLetter(VOCAB[idx].word) === letter)
      : all.slice();
    shuffleInPlace(pool);
    return pool;
  }

  function syncFlashLetterButtons() {
    flashAlphabet.querySelectorAll("button.flash-letter").forEach((btn) => {
      btn.classList.toggle("active", btn.dataset.letter === flashFilterLetter);
    });
  }

  function onFlashLetterClick(ev) {
    const btn = ev.target.closest("button.flash-letter");
    if (!btn) return;
    const L = btn.dataset.letter;
    if (flashFilterLetter === L) flashFilterLetter = null;
    else flashFilterLetter = L;
    syncFlashLetterButtons();
    const next = buildFlashOrder();
    if (!next.length) {
      flashFilterLetter = null;
      syncFlashLetterButtons();
      flashOrder = buildFlashOrder();
      flashPos = 0;
      flashReveal = false;
      renderFlash();
      flashStats.textContent = "该首字母下暂无单词，已取消筛选。";
      return;
    }
    flashOrder = next;
    flashPos = 0;
    flashReveal = false;
    renderFlash();
  }

  function renderFlash() {
    if (!flashOrder.length) {
      flashWord.textContent = "";
      flashWord.dataset.word = "";
      flashWord.dataset.zh = "";
      flashWord.classList.add("concealed");
      flashWord.setAttribute("aria-hidden", "true");
      flashZh.textContent = "";
      flashZh.classList.add("concealed");
      flashStats.textContent = "当前没有可显示的卡片。";
      flashProgress.style.width = "0%";
      return;
    }
    const e = VOCAB[flashOrder[flashPos]];
    setImageWithFade(flashImg, e.file, e.word);
    flashWord.dataset.word = e.word;
    flashWord.dataset.zh = e.zh != null ? String(e.zh) : "";
    flashZh.dataset.zh = flashWord.dataset.zh;
    if (flashReveal) {
      flashWord.textContent = e.word;
      flashWord.classList.remove("concealed");
      flashWord.setAttribute("aria-hidden", "false");
      flashZh.textContent = flashZh.dataset.zh || "";
      flashZh.classList.remove("concealed");
    } else {
      flashWord.textContent = "";
      flashWord.classList.add("concealed");
      flashWord.setAttribute("aria-hidden", "true");
      flashZh.textContent = "";
      flashZh.classList.add("concealed");
    }
    flashStats.textContent = `第 ${flashPos + 1} / ${flashOrder.length} 张`;
    flashProgress.style.width = `${((flashPos + 1) / flashOrder.length) * 100}%`;
  }

  function startFlash() {
    flashFilterLetter = null;

      return;
    }
    spellCurrent = VOCAB[spellQueue[spellPos]];
    setImageWithFade(spellImg, spellCurrent.file, spellCurrent.word);
    updateSpellHint();
    spellInput.focus();
    updateSpellStats();
  }

  function nextSpellWord() {
    if (!spellCurrent) return;
    markWordSeen(spellCurrent.word);
    updateStreakLine(spellStreakEl, false);
    advanceSpellQuestion();
  }

  function checkSpell() {
    if (!spellCurrent) return;
    const guess = spellInput.value.trim().toLowerCase();
    const target = spellCurrent.word.trim().toLowerCase();
    if (guess === target) {
      markWordSeen(spellCurrent.word);
      spellRoundCorrect += 1;
      updateStreakLine(spellStreakEl, true);
      spawnConfetti();
      spellMsg.textContent = "正确！";
      spellMsg.className = "msg ok";
      spellMsg.classList.remove("hidden");
      if (isAutoNext()) {
        setTimeout(() => advanceSpellQuestion(), 650);
      } else if (spellContinue) {
        spellContinue.classList.remove("hidden");
      } else {
        advanceSpellQuestion();
      }
      return;
    }
    if (!spellCountedThisQuestion) {
      spellCountedThisQuestion = true;
      updateStreakLine(spellStreakEl, false);
    }
    spellMsg.textContent = "不对，再试一次。";
    spellMsg.className = "msg bad";
    spellMsg.classList.remove("hidden");
  }

  function startSpell() {
    if (spellContinue) spellContinue.classList.add("hidden");
    spellQueue = buildRoundQueueIndices();
    spellPos = 0;
    spellRoundCorrect = 0;
    spellCountedThisQuestion = false;
    resetStreakLine([spellStreakEl]);
    showView("spell");
    if (!spellQueue.length) {
      spellStats.textContent = "词表为空";
      return;
    }
    spellCurrent = VOCAB[spellQueue[spellPos]];
    spellMsg.classList.add("hidden");
    spellInput.value = "";
    spellAnswerLine.classList.add("hidden");
    setImageWithFade(spellImg, spellCurrent.file, spellCurrent.word);
    updateSpellHint();
    updateSpellStats();
    spellInput.focus();
  }

  spellHintToggle.addEventListener("change", updateSpellHint);
  document.getElementById("spell-submit").addEventListener("click", checkSpell);
  document.getElementById("spell-skip").addEventListener("click", nextSpellWord);
  document.getElementById("spell-show-answer").addEventListener("click", () => {
    if (!spellCurrent) return;
    spellAnswerLine.textContent = `答案：${spellCurrent.word}`;
    spellAnswerLine.classList.remove("hidden");
  });
  document.getElementById("spell-add-wordbook").addEventListener("click", () => {
    if (!spellCurrent) return;
    const added = addToWordbook(spellCurrent.word);
    spellMsg.textContent = added ? "已加入生词本。" : "该单词已在生词本中。";
    spellMsg.className = added ? "msg ok" : "msg bad";
    spellMsg.classList.remove("hidden");
  });
  spellInput.addEventListener("keydown", (ev) => {
    if (ev.key === "Enter") { ev.preventDefault(); checkSpell(); }
  });
  if (spellContinue) {
    spellContinue.addEventListener("click", () => advanceSpellQuestion());
  }

  /* ===== 首字母模式（每轮 20） ===== */
  let firstQueue = [];
  let firstPos = 0;
  let firstCurrent = null;
  let firstRoundCorrect = 0;
  let firstCountedThisQuestion = false;

  const firstImg = document.getElementById("first-img");
  const firstInput = document.getElementById("first-input");
  const firstMsg = document.getElementById("first-msg");
  const firstStats = document.getElementById("first-stats");
  const firstAnswerLine = document.getElementById("first-answer-line");
  const firstStreakEl = document.getElementById("first-streak");
  const firstContinue = document.getElementById("first-continue");

  function updateFirstStats() {
    const n = firstQueue.length;
    if (!n) {
      firstStats.textContent = "";
      return;
    }
    firstStats.textContent = `第 ${firstPos + 1} / ${n} 题 · 本轮答对 ${firstRoundCorrect} 题`;
  }

  function advanceFirstQuestion() {
    if (firstContinue) firstContinue.classList.add("hidden");
    firstPos += 1;
    firstCountedThisQuestion = false;
    firstMsg.classList.add("hidden");
    firstInput.value = "";
    firstAnswerLine.classList.add("hidden");
    if (firstPos >= firstQueue.length) {
      showRoundComplete("first", firstRoundCorrect, firstQueue.length);
      firstCurrent = null;
      return;
    }
    firstCurrent = VOCAB[firstQueue[firstPos]];
    setImageWithFade(firstImg, firstCurrent.file, firstCurrent.word);
    firstInput.focus();
    updateFirstStats();
  }

  function nextFirstWord() {
    if (!firstCurrent) return;
    markWordSeen(firstCurrent.word);
    updateStreakLine(firstStreakEl, false);
    advanceFirstQuestion();
  }

  function checkFirst() {
    if (!firstCurrent) return;
    const raw = firstInput.value.trim();
    if (!raw) {
      firstMsg.textContent = "请输入至少一个字符。";
      firstMsg.className = "msg bad";
      firstMsg.classList.remove("hidden");
      return;
    }
    const g = raw.charAt(0).toLowerCase();
    const target = firstCurrent.word.charAt(0).toLowerCase();
    if (g === target) {
      markWordSeen(firstCurrent.word);
      firstRoundCorrect += 1;
      updateStreakLine(firstStreakEl, true);
      spawnConfetti();
      firstMsg.textContent = "正确！";
      firstMsg.className = "msg ok";
      firstMsg.classList.remove("hidden");
      if (isAutoNext()) {
        setTimeout(() => advanceFirstQuestion(), 650);
      } else if (firstContinue) {
        firstContinue.classList.remove("hidden");
      } else {
        advanceFirstQuestion();
      }
      return;
    }
    if (!firstCountedThisQuestion) {
      firstCountedThisQuestion = true;
      updateStreakLine(firstStreakEl, false);
    }
    firstMsg.textContent = "不对，再试一次。";
    firstMsg.className = "msg bad";
    firstMsg.classList.remove("hidden");
  }

  function startFirst() {
    if (firstContinue) firstContinue.classList.add("hidden");
    firstQueue = buildRoundQueueIndices();
    firstPos = 0;
    firstRoundCorrect = 0;
    firstCountedThisQuestion = false;
    resetStreakLine([firstStreakEl]);
    showView("first");
    if (!firstQueue.length) {
      firstStats.textContent = "词表为空";
      return;
    }
    firstCurrent = VOCAB[firstQueue[firstPos]];
    firstMsg.classList.add("hidden");
    firstInput.value = "";
    firstAnswerLine.classList.add("hidden");
    setImageWithFade(firstImg, firstCurrent.file, firstCurrent.word);
    updateFirstStats();
    firstInput.focus();
  }

  document.getElementById("first-submit").addEventListener("click", checkFirst);
  document.getElementById("first-skip").addEventListener("click", nextFirstWord);
  document.getElementById("first-show-answer").addEventListener("click", () => {
    if (!firstCurrent) return;
    firstAnswerLine.textContent = `答案：${firstCurrent.word}`;
    firstAnswerLine.classList.remove("hidden");
  });
  document.getElementById("first-add-wordbook").addEventListener("click", () => {
    if (!firstCurrent) return;
    const added = addToWordbook(firstCurrent.word);
    firstMsg.textContent = added ? "已加入生词本。" : "该单词已在生词本中。";
    firstMsg.className = added ? "msg ok" : "msg bad";
    firstMsg.classList.remove("hidden");
  });
  firstInput.addEventListener("keydown", (ev) => {
    if (ev.key === "Enter") { ev.preventDefault(); checkFirst(); }
  });
  if (firstContinue) {
    firstContinue.addEventListener("click", () => advanceFirstQuestion());
  }
</script>
</body>
</html>
