<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>24点</title>
  <link rel="stylesheet" href="css/app.css" />
</head>
<body>
<div class="app">
  <section class="panel">
    <div class="toolbar">
      <a href="index.html" class="secondary back-btn">← 返回主菜单</a>
      <span class="spacer"></span>
    </div>
    <div class="home-hero">
      <div class="hero-emoji">🔢🎯</div>
      <h1>24点</h1>
      <p class="lead" id="game24-lead">用四个数字算出 24。每个数字只能用一次。</p>
    </div>

    <div class="game24-mode-tabs" role="tablist" aria-label="24点模式">
      <button type="button" class="game24-mode-tab is-active" id="game24-tab-play" data-mode="play" role="tab" aria-selected="true">练习模式</button>
      <button type="button" class="game24-mode-tab" id="game24-tab-solve" data-mode="solve" role="tab" aria-selected="false">求解模式</button>
    </div>

    <!-- 练习模式 -->
    <div id="game24-play" class="game24-mode-panel">
      <div id="game24-numbers" class="game24-numbers" aria-live="polite"></div>
      <p class="game24-input-label">你的算式</p>
      <div id="game24-expr" class="game24-expr is-empty" aria-live="polite" aria-label="你的算式">点击数字和符号组成算式</div>
      <div class="game24-keypad btn-row" id="game24-keypad">
        <button type="button" class="secondary game24-key" data-token="+">+</button>
        <button type="button" class="secondary game24-key" data-token="-">−</button>
        <button type="button" class="secondary game24-key" data-token="×">×</button>
        <button type="button" class="secondary game24-key" data-token="÷">÷</button>
        <button type="button" class="secondary game24-key" data-token="(">(</button>
        <button type="button" class="secondary game24-key" data-token=")">)</button>
        <button type="button" class="secondary game24-key" id="game24-backspace">退格</button>
      </div>
      <div class="btn-row game24-actions">
        <button type="button" id="game24-check">检查</button>
        <button type="button" class="secondary" id="game24-answer">查看答案</button>
        <button type="button" class="secondary" id="game24-clear">清空</button>
        <button type="button" class="secondary" id="game24-deal">换一题</button>
      </div>
    </div>

    <!-- 求解模式 -->
    <div id="game24-solve" class="game24-mode-panel hidden">
      <p class="game24-input-label">已选 4 张牌（点牌面选择，再点可取消）</p>
      <div id="game24-solve-slots" class="game24-numbers game24-solve-slots" aria-live="polite"></div>
      <p class="game24-input-label">点选扑克牌：A=1，J=11，Q=12，K=13</p>
      <div id="game24-solve-pad" class="game24-solve-pad" aria-label="选牌"></div>
      <div class="btn-row game24-actions">
        <button type="button" id="game24-solve-run">求解</button>
        <button type="button" class="secondary" id="game24-solve-clear">清空选牌</button>
      </div>
      <div id="game24-solve-result" class="game24-solve-result hidden" aria-live="polite"></div>
    </div>

    <p id="game24-msg" class="msg hidden" role="status"></p>
  </section>
</div>

<div id="confetti-root" class="confetti-root" aria-hidden="true"></div>
<div id="praise-toast" class="praise-toast" role="status" aria-live="assertive" aria-atomic="true"></div>

<script src="js/utils.js"></script>
<script src="js/fx.js"></script>
<script src="js/game24.js?v=20260719b"></script>
</body>
</html>
